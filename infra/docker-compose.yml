services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: thermalguard
      POSTGRES_USER: thermalguard
      POSTGRES_PASSWORD: thermalguard
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://thermalguard:thermalguard@db:5432/thermalguard
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [db]
  worker:
    build: ../backend
    command: ["python","worker.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://thermalguard:thermalguard@db:5432/thermalguard
    depends_on: [db]
volumes:
  pgdata:
